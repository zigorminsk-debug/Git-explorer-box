plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.gitexplorerbox.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gitexplorerbox.app'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.0.4'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    signingConfigs {
        // Постоянная подпись релиза. Ключ берётся из переменных окружения
        // (в GitHub Actions — из Secrets). Один и тот же сертификат позволяет
        // устанавливать обновление поверх уже установленного приложения.
        release {
            def storeFilePath = System.getenv('RELEASE_STORE_FILE') ?: 'release-keystore.jks'
            storeFile file(storeFilePath)
            storePassword System.getenv('RELEASE_STORE_PASSWORD') ?: ''
            keyAlias System.getenv('RELEASE_KEY_ALIAS') ?: 'release'
            keyPassword System.getenv('RELEASE_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
