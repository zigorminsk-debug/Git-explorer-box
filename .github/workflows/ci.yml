name: CI

on:
  push:
    branches: ['main', 'arena/**']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare local.properties (use preinstalled Android SDK)
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK_DIR" > ${{ github.workspace }}/local.properties
          cat ${{ github.workspace }}/local.properties

      - name: Install required SDK components
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -f "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          elif [ -f "$SDK_DIR/cmdline-tools/bin/sdkmanager" ]; then
            SM="$SDK_DIR/cmdline-tools/bin/sdkmanager"
          else
            echo "sdkmanager not found!"
            exit 1
          fi
          echo "Using sdkmanager: $SM"
          yes | "$SM" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -f "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          elif [ -f "$SDK_DIR/cmdline-tools/bin/sdkmanager" ]; then
            SM="$SDK_DIR/cmdline-tools/bin/sdkmanager"
          else
            echo "sdkmanager not found!"
            exit 1
          fi
          yes | "$SM" --sdk_root="$SDK_DIR" --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (stream output to console)
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee /tmp/build-output.txt

      - name: Save build error log to repo
        if: failure()
        run: |
          cp /tmp/build-output.txt BUILD_ERROR.log
          git config user.email "ci@github-actions"
          git config user.name "GitHub Actions"
          git add BUILD_ERROR.log
          git commit -m "CI build error log [skip ci]"
          git push origin ${{ github.ref }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GitExplorerBox-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
