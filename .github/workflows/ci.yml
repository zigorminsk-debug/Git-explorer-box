name: CI

on:
  push:
    branches: ['main', 'arena/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare local.properties (use preinstalled Android SDK)
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK_DIR" > ${{ github.workspace }}/local.properties

      - name: Accept Android SDK licenses
        run: |
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (retry up to 3 times on transient failures)
        run: |
          for i in 1 2 3; do
            echo "=== Build attempt $i ==="
            if gradle assembleDebug --stacktrace; then
              echo "Build succeeded on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "All build attempts failed"
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GitExplorerBox-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
