name: CI

on:
  push:
    branches: ['main', 'arena/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          sdk: 'platform-tools,android-34,build-tools;34.0.0'

      - name: Export Android SDK path for Gradle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: gradle test

      - name: Report failure as issue
        if: failure()
        run: |
          gradle test --stacktrace > /tmp/test-output.txt 2>&1 || true
          gh issue create \
            --title "CI failure — $(date +%Y-%m-%d_%H-%M-%S)" \
            --label "ci-failure" \
            --body "```$(cat /tmp/test-output.txt)```" \
            --repo zigorminsk-debug/Git-explorer-box || true

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GitExplorerBox-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
