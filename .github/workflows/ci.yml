name: CI

on:
  push:
    branches: ['main', 'arena/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android SDK via sdkmanager
        run: |
          mkdir -p /opt/android-sdk
          cd /opt/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-*.zip
          yes | cmdline-tools/bin/sdkmanager --sdk_root=/opt/android-sdk "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          echo "sdk.dir=/opt/android-sdk" > ${{ github.workspace }}/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests (capture stacktrace)
        run: |
          gradle test --stacktrace > /tmp/test-output.txt 2>&1 || echo "TESTS_FAILED" > /tmp/test-status.txt

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Report test failure as issue
        if: failure()
        run: |
          gh issue create \
            --title "CI test failure — $(date +%Y-%m-%d_%H-%M-%S)" \
            --label "ci-failure" \
            --body "```$(cat /tmp/test-output.txt | head -c 60000)```" \
            --repo zigorminsk-debug/Git-explorer-box || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GitExplorerBox-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
