name: CI

on:
  push:
    branches: ['main', 'arena/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare local.properties (use preinstalled Android SDK)
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK_DIR" > ${{ github.workspace }}/local.properties
          cat ${{ github.workspace }}/local.properties

      - name: Debug SDK environment
        run: |
          echo "=== ANDROID_HOME=$ANDROID_HOME ==="
          echo "=== SDK_DIR contents ==="
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/" 2>&1 || echo "SDK dir not found"
          echo "=== cmdline-tools ==="
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/" 2>&1 || echo "cmdline-tools not found"
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/" 2>&1 || echo "cmdline-tools/latest not found"
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/" 2>&1 || echo "cmdline-tools/latest/bin not found"
          echo "=== build-tools ==="
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/" 2>&1 || echo "build-tools not found"
          echo "=== platforms ==="
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms/" 2>&1 || echo "platforms not found"

      - name: Install required SDK components
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          # Try both cmdline-tools paths
          if [ -f "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          elif [ -f "$SDK_DIR/cmdline-tools/bin/sdkmanager" ]; then
            SM="$SDK_DIR/cmdline-tools/bin/sdkmanager"
          else
            echo "sdkmanager not found!"
            exit 1
          fi
          echo "Using sdkmanager: $SM"
          yes | "$SM" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -f "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          elif [ -f "$SDK_DIR/cmdline-tools/bin/sdkmanager" ]; then
            SM="$SDK_DIR/cmdline-tools/bin/sdkmanager"
          else
            echo "sdkmanager not found!"
            exit 1
          fi
          yes | "$SM" --sdk_root="$SDK_DIR" --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (stream output to console)
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --info 2>&1 | tee /tmp/build-output.txt

      - name: Report build failure as commit comment
        if: failure()
        run: |
          ERROR_LOG=$(cat /tmp/build-output.txt | head -c 30000)
          curl -s -X POST "https://api.github.com/repos/zigorminsk-debug/Git-explorer-box/commits/${{ github.sha }}/comments" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"body\":\"CI build failure: \`\`\`${ERROR_LOG}\`\`\`\"}" || true

      - name: Upload build output log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-log
          path: /tmp/build-output.txt
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GitExplorerBox-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
