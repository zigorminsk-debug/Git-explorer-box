name: CI

on:
  push:
    branches: ['main', 'arena/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android SDK via sdkmanager
        run: |
          mkdir -p /opt/android-sdk
          cd /opt/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-*.zip
          yes | cmdline-tools/bin/sdkmanager --sdk_root=/opt/android-sdk "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          echo "sdk.dir=/opt/android-sdk" > ${{ github.workspace }}/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (retry up to 3 times, clear Gradle cache first)
        run: |
          # Clear potentially corrupted Gradle build cache
          rm -rf ~/.gradle/caches/build-cache-1 2>/dev/null || true
          for i in 1 2 3; do
            echo "=== Build attempt $i ==="
            if gradle assembleDebug --stacktrace --no-build-cache; then
              echo "Build succeeded on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "All build attempts failed"
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GitExplorerBox-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
