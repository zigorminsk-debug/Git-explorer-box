name: CI

on:
  push:
    branches: ['main', 'arena/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare local.properties (use preinstalled Android SDK)
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK_DIR" > ${{ github.workspace }}/local.properties
          cat ${{ github.workspace }}/local.properties

      - name: Accept Android SDK licenses
        run: |
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (capture output)
        run: |
          set +e
          gradle assembleDebug --stacktrace > /tmp/build-output.txt 2>&1
          GRADLE_EXIT=$?
          set -e
          if [ $GRADLE_EXIT -ne 0 ]; then
            cat /tmp/build-output.txt
            exit $GRADLE_EXIT
          fi

      - name: Report build failure as commit comment
        if: failure()
        run: |
          gh api -X POST repos/zigorminsk-debug/Git-explorer-box/commits/${{ github.sha }}/comments \
            -f body="CI build failure: ```$(cat /tmp/build-output.txt | head -c 30000)```" || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GitExplorerBox-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
