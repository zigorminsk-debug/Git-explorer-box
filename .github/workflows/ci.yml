name: CI

on:
  push:
    branches: ['main', 'arena/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Show Android SDK env
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la /usr/local/lib/android/sdk 2>/dev/null || echo "No SDK at /usr/local/lib/android/sdk"
          ls -la $ANDROID_HOME 2>/dev/null || echo "ANDROID_HOME dir not found"

      - name: Prepare local.properties
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK_DIR" > ${{ github.workspace }}/local.properties
          cat ${{ github.workspace }}/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GitExplorerBox-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
