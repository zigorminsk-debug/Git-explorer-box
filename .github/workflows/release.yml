name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (пример: 1.0.2). Запишите также в CHANGELOG.md и app/build.gradle'
        required: false

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          sdk: 'platform-tools,android-34,build-tools;34.0.0'

      - name: Export Android SDK path for Gradle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore from secret
        run: echo "${{ secrets.RELEASE_STORE_FILE }}" | base64 -d > app/release-keystore.jks
        shell: bash

      - name: Assemble signed release APK
        env:
          RELEASE_STORE_FILE: app/release-keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: GitExplorerBox-release-apk
          path: app/build/outputs/apk/release/app-release.apk
