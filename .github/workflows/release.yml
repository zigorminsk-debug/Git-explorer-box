name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (пример: 1.0.5). Запишите также в CHANGELOG.md и app/build.gradle'
        required: false

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Show Android SDK env
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la /usr/local/lib/android/sdk 2>/dev/null || echo "No SDK at /usr/local/lib/android/sdk"
          ls -la $ANDROID_HOME 2>/dev/null || echo "ANDROID_HOME dir not found"

      - name: Prepare local.properties
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK_DIR" > ${{ github.workspace }}/local.properties
          cat ${{ github.workspace }}/local.properties

      - name: Accept Android SDK licenses
        run: |
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore from secret
        run: echo "${{ secrets.RELEASE_STORE_FILE }}" | base64 -d > app/release-keystore.jks
        shell: bash

      - name: Assemble signed release APK (capture output)
        env:
          RELEASE_STORE_FILE: app/release-keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace > /tmp/build-output.txt 2>&1 || echo "BUILD_FAILED" > /tmp/build-status.txt

      - name: Report build failure as commit comment
        if: failure()
        run: |
          gh api -X POST repos/zigorminsk-debug/Git-explorer-box/commits/${{ github.sha }}/comments \
            -f body="CI build failure: ```$(cat /tmp/build-output.txt | head -c 30000)```" || true

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: GitExplorerBox-release-apk
          path: app/build/outputs/apk/release/app-release.apk
