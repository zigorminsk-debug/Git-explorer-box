name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (пример: 1.0.5). Запишите также в CHANGELOG.md и app/build.gradle'
        required: false

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare local.properties (use preinstalled Android SDK)
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK_DIR" > ${{ github.workspace }}/local.properties
          cat ${{ github.workspace }}/local.properties

      - name: Install required SDK components
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -f "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          elif [ -f "$SDK_DIR/cmdline-tools/bin/sdkmanager" ]; then
            SM="$SDK_DIR/cmdline-tools/bin/sdkmanager"
          else
            echo "sdkmanager not found!"
            exit 1
          fi
          echo "Using sdkmanager: $SM"
          yes | "$SM" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -f "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          elif [ -f "$SDK_DIR/cmdline-tools/bin/sdkmanager" ]; then
            SM="$SDK_DIR/cmdline-tools/bin/sdkmanager"
          else
            echo "sdkmanager not found!"
            exit 1
          fi
          yes | "$SM" --sdk_root="$SDK_DIR" --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore from secret
        run: echo "${{ secrets.RELEASE_STORE_FILE }}" | base64 -d > app/release-keystore.jks
        shell: bash

      - name: Assemble signed release APK (capture output)
        env:
          RELEASE_STORE_FILE: app/release-keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set +e
          gradle assembleRelease --stacktrace > /tmp/build-output.txt 2>&1
          GRADLE_EXIT=$?
          set -e
          cat /tmp/build-output.txt
          if [ $GRADLE_EXIT -ne 0 ]; then
            exit $GRADLE_EXIT
          fi

      - name: Save build error log to repo
        if: failure()
        run: |
          cp /tmp/build-output.txt BUILD_ERROR.log
          git config user.email "ci@github-actions"
          git config user.name "GitHub Actions"
          git add BUILD_ERROR.log
          git commit -m "CI build error log [skip ci]"
          git push origin ${{ github.ref }}

      - name: Upload build output log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-log
          path: /tmp/build-output.txt
          if-no-files-found: warn

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: GitExplorerBox-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
