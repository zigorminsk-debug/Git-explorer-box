name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (пример: 1.0.5). Запишите также в CHANGELOG.md и app/build.gradle'
        required: false

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare local.properties (use preinstalled Android SDK)
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK_DIR" > ${{ github.workspace }}/local.properties

      - name: Accept Android SDK licenses
        run: |
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore from secret
        run: echo "${{ secrets.RELEASE_STORE_FILE }}" | base64 -d > app/release-keystore.jks
        shell: bash

      - name: Assemble signed release APK (retry up to 3 times on transient failures)
        env:
          RELEASE_STORE_FILE: app/release-keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for i in 1 2 3; do
            echo "=== Build attempt $i ==="
            if gradle assembleRelease --stacktrace; then
              echo "Build succeeded on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "All build attempts failed"
          exit 1

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: GitExplorerBox-release-apk
          path: app/build/outputs/apk/release/app-release.apk
